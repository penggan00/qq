name: Build Alpine Python Venv

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3.23
    
    steps:
    - name: Install system dependencies
      run: |
        apk add --no-cache \
          python3 python3-dev py3-pip gcc musl-dev linux-headers \
          libjpeg-turbo-dev zlib-dev libwebp-dev tiff-dev \
          freetype-dev lcms2-dev openjpeg-dev
    
    - name: Create venv and install packages
      run: |
        python3 -m venv --copies rss_venv
        source rss_venv/bin/activate
        pip install --upgrade pip
        pip install \
          psutil==7.1.3 \
          python-dotenv==1.2.1 \
          python-telegram-bot==22.5 \
          aiosqlite==0.22.0 \
          aiohttp==3.11.16 \
          Pillow==12.0.0 \
          google-genai==2.22.0 \
          md2tgmd==0.3.10
          # 移除 --break-system-packages，在 venv 中不需要
    
    - name: Clean up unused files
      run: |
        rm -rf rss_venv/lib/python3.*/site-packages/pip
        rm -rf rss_venv/lib/python3.*/site-packages/setuptools
        rm -rf rss_venv/lib/python3.*/site-packages/*.dist-info
        rm -rf rss_venv/lib/python3.*/site-packages/*.egg-info
        find rss_venv -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find rss_venv -type f -name "*.pyc" -delete 2>/dev/null || true
    
    - name: Debug size
      run: |
        echo "=== venv size ==="
        du -sh rss_venv
        echo "=== file count ==="
        find rss_venv | wc -l
    
    - name: Package
      run: tar -czf rss_venv.tar.gz rss_venv
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rss-venv-alpine
        path: rss_venv.tar.gz